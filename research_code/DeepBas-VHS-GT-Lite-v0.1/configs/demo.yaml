seed: 42
device: auto
output_dir: outputs/demo

data:
  mode: synthetic
  bundle_path: data/processed/demo_bundle.npz
  num_days: 900
  num_nodes: 8
  history: 30
  horizon: 1
  target_station_ids: [S05]
  dynamic_features: [precip, temperature, wg_dis, obs_q]
  flow_feature: obs_q
  train_fraction: 0.70
  val_fraction: 0.15

model:
  hidden_dim: 48
  temporal_layers: 1
  graph_layers: 2
  dropout: 0.10

training:
  epochs: 25
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 6
  num_workers: 0

